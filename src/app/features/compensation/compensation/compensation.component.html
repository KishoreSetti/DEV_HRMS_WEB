<app-header></app-header>
<app-sidebar></app-sidebar>

<div class="dashboard-header">
  <h2 class="dashboard-title">Employee Compensation</h2>
  <nav class="breadcrumb">
    <a href="#">Home</a> &gt;
    <a href="#">Payroll</a> &gt;
    <span>Compensation</span>
  </nav>
</div>

<div class="tab-container">

  <input type="radio" id="tab1" name="tab" [checked]="selectedTab === 'tab1'">
  <input type="radio" id="tab2" name="tab" [checked]="selectedTab === 'tab2'">


  <div class="tab-header">
    <label class="tab-label" for="tab1" *ngIf="canViewPayslip">Employee Payslip</label>
    <label class="tab-label" for="tab2" *ngIf="canViewHRDashboard">HR Payslip Dashboard</label>
  </div>

  <div id="content1" class="tab-content" *ngIf="canViewPayslip">
    <app-employee-payslip></app-employee-payslip>
  </div>


  <!-- TAB 2: MY EXPENSES WITH FILTERS -->
  <div id="content2" class="tab-content" *ngIf="canViewHRDashboard">
    <app-hr-payslip></app-hr-payslip>
  </div>
